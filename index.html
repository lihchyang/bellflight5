<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>鈴鐺飛行隊</title>
<meta name="theme-color" content="#151b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鈴鐺飛行隊">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: one portrait play field (9:16 canvas) centred on a deep-night frame; two small controls float over its top-right corner */
:root{
  --frame:#151b2e; --ink:#f5f1e6; --muted:#9aa6c4; --chip:rgba(10,14,28,.55); --chip-line:rgba(255,255,255,.25);
  --f-ui:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--frame);color:var(--ink);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.app{height:100%;display:grid;place-items:center;padding-inline:0}
.stage{position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.5);border-radius:6px;overflow:hidden}
canvas{display:block;touch-action:none;outline:none}
.ctl{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.ctl button{background:var(--chip);color:var(--ink);border:1px solid var(--chip-line);border-radius:999px;padding:5px 11px;font:600 12px var(--f-ui);cursor:pointer}
.ctl button:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}

html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:#ffffff;color:#1d2a30;border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:10}
.install p{margin:0;flex:1;min-width:0}
.install button{border:0;background:transparent;color:#5d6f77;font:inherit;font-size:20px;padding:0 4px;cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" aria-label="遊戲畫面，可用方向鍵或 WASD 移動"></canvas>
    <div class="ctl">
      <button id="btnSound" aria-pressed="true">聲音 開</button>
      <button id="btnPause">暫停</button>
    </div>
  </div>
</div>

<script>
(function(){
const W=360,H=640;
const cv=document.getElementById("cv"),g=cv.getContext("2d"),stage=document.getElementById("stage"),app=document.getElementById("app");
let SC=1,DPR=1;
function resize(){
  const aw=app.clientWidth,ah=app.clientHeight;
  let w=Math.min(aw,ah*W/H);w=Math.max(200,Math.floor(w));const h=Math.floor(w*H/W);
  DPR=Math.min(window.devicePixelRatio||1,2);SC=w/W;
  cv.style.width=w+"px";cv.style.height=h+"px";stage.style.width=w+"px";stage.style.height=h+"px";
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
}
addEventListener("resize",resize);resize();

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hi=store.get("bell.hi",0),soundOn=store.get("bell.sound",true);

/* ================= sound (all synthesized) ================= */
const Snd=(()=>{
  let ctx=null,master=null,noise=null,musicGain=null,nextT=0,step=0,timer=null;
  function unlock(){try{
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.6;master.connect(ctx.destination);
      musicGain=ctx.createGain();musicGain.gain.value=.22;musicGain.connect(master);
      noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(ctx.state==="suspended")ctx.resume()}catch(e){}}
  const ok=()=>soundOn&&ctx&&ctx.state==="running";
  const R2=(a,b)=>a+Math.random()*(b-a);
  function tone(f,t,d,type,v,f2,out){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    const gg=ctx.createGain();gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(v,t+.005);gg.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gg).connect(out||master);o.start(t);o.stop(t+d+.02)}
  function burst(t,d,v,f,q){const n=ctx.createBufferSource();n.buffer=noise;const bp=ctx.createBiquadFilter();bp.type="lowpass";bp.frequency.setValueAtTime(f,t);bp.frequency.exponentialRampToValueAtTime(80,t+d);
    const gg=ctx.createGain();gg.gain.setValueAtTime(v,t);gg.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(bp).connect(gg).connect(master);n.start(t,Math.random()*.5,d+.05)}
  const FX={
    shot:t=>tone(1400,t,.05,"square",.025,700),
    pop:t=>{burst(t,.18,.35,2500);tone(300,t,.12,"square",.06,80)},
    boom:t=>{burst(t,.9,.7,1800);tone(120,t,.6,"sawtooth",.15,30)},
    // little hand-bell "ling-ling": two quick strikes with metallic (inharmonic) partials
    ring:t=>{const f=R2(2100,2400);for(const k of[0,.07]){[[1,.16,.5],[2.76,.06,.25],[5.4,.03,.12]].forEach(([m,v,d])=>tone(f*m,t+k,d,"sine",v))}},
    bell:t=>{[1568,2093].forEach((f,k)=>{tone(f,t+k*.07,.35,"sine",.18);tone(f*2.7,t+k*.07,.15,"sine",.04)})},
    power:t=>{[523,659,784,1047,1319].forEach((f,k)=>tone(f,t+k*.06,.14,"square",.06))},
    shield:t=>tone(300,t,.25,"triangle",.15,900),
    hurt:t=>{tone(700,t,.5,"square",.1,90);burst(t,.5,.4,1200)},
    warn:t=>{for(let k=0;k<3;k++){tone(880,t+k*.4,.18,"square",.08);tone(660,t+k*.4+.2,.18,"square",.08)}},
    clear:t=>{[523,659,784,659,784,1047].forEach((f,k)=>tone(f,t+k*.11,.2,"square",.07))},
    over:t=>{[523,494,440,392,330].forEach((f,k)=>tone(f,t+k*.18,.25,"triangle",.12))}};
  const lastPlay={},GAP={shot:.09,ring:.06,pop:.05,bell:.08};
  function play(n){if(!ok())return;const now=ctx.currentTime;if(GAP[n]&&now-(lastPlay[n]||-1)<GAP[n])return;lastPlay[n]=now;try{FX[n](now+.01)}catch(e){}}
  // original 16-bar chiptune in D major, 168 BPM: pulse lead, thin arpeggio, triangle bass, noise drums
  const SONG=[
   ["D",[[0,81,2],[2,78,1],[3,81,1],[4,86,3],[7,81,1],[8,83,1],[9,81,1],[10,78,2],[12,81,4]]],
   ["Bm",[[0,83,2],[2,81,1],[3,78,1],[4,74,2],[6,78,2],[8,76,2],[10,78,2],[12,74,4]]],
   ["G",[[0,79,2],[2,83,2],[4,86,2],[6,83,1],[7,86,1],[8,88,3],[11,86,1],[12,83,2],[14,79,2]]],
   ["A",[[0,81,3],[3,76,1],[4,81,2],[6,85,2],[8,88,4],[12,85,2],[14,81,2]]],
   ["D",[[0,81,2],[2,78,1],[3,81,1],[4,86,3],[7,81,1],[8,83,1],[9,86,1],[10,90,2],[12,88,4]]],
   ["F#m",[[0,85,2],[2,81,2],[4,78,2],[6,81,2],[8,85,1],[9,86,1],[10,85,2],[12,81,4]]],
   ["G",[[0,79,1],[1,81,1],[2,83,2],[4,86,2],[6,83,2],[8,79,1],[9,81,1],[10,83,2],[12,76,4]]],
   ["A",[[0,81,2],[2,85,2],[4,88,2],[6,85,2],[8,88,6]]],
   ["G",[[0,83,3],[3,83,3],[6,86,2],[8,83,2],[10,79,2],[12,81,2],[14,83,2]]],
   ["A",[[0,85,3],[3,85,3],[6,88,2],[8,85,2],[10,81,2],[12,83,2],[14,85,2]]],
   ["F#m",[[0,86,3],[3,85,3],[6,81,2],[8,78,4],[12,81,2],[14,85,2]]],
   ["Bm",[[0,86,3],[3,83,3],[6,78,2],[8,74,4],[12,78,2],[14,83,2]]],
   ["Em",[[0,79,2],[2,83,2],[4,86,2],[6,91,2],[8,90,2],[10,88,2],[12,86,2],[14,83,2]]],
   ["A",[[0,85,2],[2,88,2],[4,93,2],[6,92,2],[8,93,4],[12,88,2],[14,85,2]]],
   ["D",[[0,86,2],[2,81,1],[3,86,1],[4,90,2],[6,86,2],[8,93,2],[10,90,2],[12,86,2],[14,81,2]]],
   ["A",[[0,79,2],[2,78,2],[4,76,2],[6,73,2],[8,76,2],[10,79,2],[12,81,4]]]];
  const CH={D:[38,0],Bm:[35,1],G:[43,0],A:[45,0],"F#m":[42,1],Em:[40,1]};
  const mf=m=>440*Math.pow(2,(m-69)/12),S16=60/168/4;
  let pulse25=null,pulse12=null;
  function pulseWave(d){const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);return ctx.createPeriodicWave(re,im)}
  function note(f,t,d,wave,v){const o=ctx.createOscillator();if(typeof wave==="string")o.type=wave;else o.setPeriodicWave(wave);o.frequency.value=f;
    const gg=ctx.createGain();gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(v,t+.004);gg.gain.setValueAtTime(v,t+d*.75);gg.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gg).connect(musicGain);o.start(t);o.stop(t+d+.02)}
  function drum(kind,t){
    if(kind==="k"){const o=ctx.createOscillator();o.type="triangle";o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.09);const gg=ctx.createGain();gg.gain.setValueAtTime(.7,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(gg).connect(musicGain);o.start(t);o.stop(t+.14);return}
    const n=ctx.createBufferSource();n.buffer=noise;const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=kind==="s"?1200:7000;
    const gg=ctx.createGain();const d=kind==="s"?.12:.035;gg.gain.setValueAtTime(kind==="s"?.35:.12,t);gg.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(hp).connect(gg).connect(musicGain);n.start(t,Math.random()*.5,d+.02)}
  function sched(){if(!ctx||ctx.state!=="running")return;if(!pulse25){pulse25=pulseWave(.25);pulse12=pulseWave(.125)}
    if(nextT<ctx.currentTime-.05)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.2){
      const bar=Math.floor(step/16)%SONG.length,st=step%16,[ch,mel]=SONG[bar],[root,minor]=CH[ch];
      for(const[s0,m,l]of mel)if(s0===st)note(mf(m),nextT,l*S16*.95,pulse25,.16);
      const tones=[0,minor?3:4,7,12];note(mf(root+24+tones[[0,1,2,3,2,1,2,3][st%8]]),nextT,S16*.8,pulse12,.05);
      if(st%2===0)note(mf(root+(st%4===0?0:12)),nextT,S16*1.8,"triangle",.32);
      if(st===0||st===8||(st===10&&bar%2))drum("k",nextT);
      if(st===4||st===12||(bar%4===3&&st===14))drum("s",nextT);
      if(st%2===0)drum("h",nextT);
      nextT+=S16;step++}}
  function music(on){if(!ctx)return;clearInterval(timer);timer=null;if(on&&soundOn){nextT=ctx.currentTime+.05;timer=setInterval(sched,40)}}
  return{unlock,play,music};
})();

/* ================= game state ================= */
const COLORS=["yellow","white","red","blue","green"];
const BELL_COL={yellow:"#ffd23f",white:"#f4f7ff",blue:"#4fa3ff",green:"#5ad67d",red:"#ff5a5a"};
const CHAIN=[500,1000,2000,4000,8000,10000];
let G=null,keys={},state="title",stateT=0,paused=false;
const rnd=(a,b)=>a+Math.random()*(b-a);
function newGame(){
  G={t:0,stage:1,score:0,lives:3,nextLife:30000,scroll:0,
    p:{x:W/2,y:H-110,tx:W/2,ty:H-110,speed:1,twin:false,opts:0,shield:0,inv:2,dead:0},
    hist:[],histAcc:0,fireT:0,bombT:0,shotN:0,waveT:2,cloudT:1,groundT:2,decoT:0,
    bul:[],bombs:[],en:[],eb:[],clouds:[],bells:[],ground:[],deco:[],fx:[],txt:[],chain:0,boss:null,clearT:0,warnT:0};
  for(let y=-20;y<H;y+=24)spawnDeco(y);
  for(let k=0;k<3;k++)G.clouds.push(makeCloud(rnd(60,H-260)));
}
const mul=()=>1+.25*(G.stage-1);
function addScore(n,x,y){G.score+=n;if(x!=null)G.txt.push({x,y,s:String(n),t:0});
  if(G.score>=G.nextLife){G.lives++;G.nextLife+=50000;G.txt.push({x:W/2,y:H/2,s:"1UP",t:0,big:1});Snd.play("power")}}

/* ---------- spawns ---------- */
function makeCloud(y){return{x:rnd(40,W-40),y:y??-40,r:rnd(22,30),bells:Math.random()<.35?2:1,cool:0,v:rnd(10,22)}}
function spawnDeco(y){const kind=Math.random();G.deco.push({x:rnd(10,W-10),y,kind:kind<.65?"tree":kind<.85?"bush":"rock",s:rnd(.8,1.3)})}
function spawnWave(){
  const s=G.stage,r=Math.random();
  if(r<.32){const x0=rnd(80,W-80),n=5;for(let i=0;i<n;i++)G.en.push({type:"donut",x:x0,y:-20-i*34,x0,ph:i*.7,hp:1,r:13,score:100,t:0,shot:Math.random()<.25*mul()})}
  else if(r<.55){for(let i=0;i<3;i++)G.en.push({type:"top",x:rnd(40,W-40),y:-20-i*40,vx:0,vy:80,hp:2,r:13,score:200,t:0,dive:false})}
  else if(r<.78){const left=Math.random()<.5;for(let i=0;i<4;i++)G.en.push({type:"plane",x:left?-20-i*30:W+20+i*30,y:30+i*26,vx:(left?1:-1)*rnd(150,180),vy:90,hp:1,r:11,score:150,t:0})}
  else G.en.push({type:"pot",x:rnd(60,W-60),y:-30,vy:70,stopY:rnd(90,170),hp:Math.round(5*mul()),r:18,score:500,t:0,fire:1})
}
function spawnGround(){const turret=Math.random()<.6;G.ground.push({type:turret?"turret":"hut",x:rnd(30,W-30),y:-20,hp:1,r:14,fire:rnd(1,2.5),score:turret?300:500})}
function spawnBoss(){G.boss={x:W/2,y:-90,hp:Math.round(90+50*(G.stage-1)),max:Math.round(90+50*(G.stage-1)),r:44,t:0,fan:2,aim:1.2,flash:0};G.warnT=2.2;Snd.play("warn")}

/* ---------- input ---------- */
let drag=null;
function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
cv.addEventListener("pointerdown",e=>{
  Snd.unlock();e.preventDefault();grabFocus();
  if(state==="title"||(state==="over"&&stateT>1)){start();return}
  if(paused){setPause(false);return}
  if(state==="play"){drag=toLocal(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}}
});
cv.addEventListener("pointermove",e=>{if(!drag||state!=="play"||paused)return;const p=toLocal(e),P=G.p;
  P.tx=Math.max(14,Math.min(W-14,P.tx+(p.x-drag.x)*1.25));P.ty=Math.max(60,Math.min(H-24,P.ty+(p.y-drag.y)*1.25));drag=p});
const endDrag=()=>{drag=null};cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  if((e.key===" "||e.key==="Enter")&&(state==="title"||(state==="over"&&stateT>1))){Snd.unlock();start()}
  if((e.key==="p"||e.key==="P"||e.key==="Escape")&&state==="play")setPause(!paused)});
addEventListener("keyup",e=>{keys[e.key]=false});
addEventListener("blur",()=>{keys={}});
// keyboard focus: tapping the game must move focus into it (preventDefault on pointerdown would otherwise block that)
function grabFocus(){try{window.focus();cv.focus({preventScroll:true})}catch(_){}}
grabFocus();
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play")setPause(true)});
const btnPause=document.getElementById("btnPause"),btnSound=document.getElementById("btnSound");
function setPause(v){paused=v;btnPause.textContent=v?"繼續":"暫停";Snd.music(!v&&state==="play")}
btnPause.onclick=()=>{Snd.unlock();if(state==="play")setPause(!paused)};
function syncSound(){btnSound.textContent=soundOn?"聲音 開":"聲音 關";btnSound.setAttribute("aria-pressed",soundOn)}
btnSound.onclick=()=>{Snd.unlock();soundOn=!soundOn;store.set("bell.sound",soundOn);syncSound();Snd.music(soundOn&&state==="play"&&!paused)};
syncSound();
function start(){newGame();state="play";stateT=0;setPause(false);Snd.music(true)}

/* ---------- update ---------- */
const SCROLL=42;
function shooters(){const P=G.p,a=[{x:P.x,y:P.y}];for(let i=1;i<=G.p.opts;i++){const h=G.hist[G.hist.length-1-i*9];if(h)a.push({x:h.x,y:h.y,opt:1})}return a}
function hitPlayer(){const P=G.p;if(P.inv>0||P.dead>0)return;
  if(P.shield>0)return;
  explode(P.x,P.y,"#ffb347",26);Snd.play("hurt");G.lives--;P.dead=1.3;P.twin=false;P.opts=0;P.speed=Math.max(1,P.speed-1);G.eb=[];
}
function explode(x,y,c,n){for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,v=rnd(40,200);G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(.3,.7),c,r:rnd(2,4)})}G.fx.push({x,y,ring:1,t:0,life:.35,c})}
function aimed(x,y,sp){const P=G.p,a=Math.atan2(P.y-y,P.x-x);G.eb.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp})}
function collectBell(b){const P=G.p;Snd.play("bell");
  switch(b.c){
    case"yellow":{const v=CHAIN[Math.min(G.chain,CHAIN.length-1)];G.chain++;addScore(v,b.x,b.y-14);break}
    case"white":P.twin=true;G.txt.push({x:b.x,y:b.y-14,s:"雙砲",t:0});Snd.play("power");break;
    case"blue":P.speed=Math.min(5,P.speed+1);G.txt.push({x:b.x,y:b.y-14,s:"加速",t:0});break;
    case"green":P.opts=Math.min(2,P.opts+1);G.txt.push({x:b.x,y:b.y-14,s:"分身",t:0});Snd.play("power");break;
    case"red":P.shield=60;G.txt.push({x:b.x,y:b.y-14,s:"護盾 60 秒",t:0});Snd.play("shield");break}
  if(b.c!=="yellow")G.chain=0}

function update(dt){
  stateT+=dt;
  if(state!=="play"||paused){if(state!=="play"&&G){G.scroll+=SCROLL*.5*dt;moveWorld(SCROLL*.5*dt,dt)}return}
  const P=G.p,m=mul();
  G.t+=dt;const ds=SCROLL*dt;G.scroll+=ds;
  // player
  if(P.dead>0){P.dead-=dt;if(P.dead<=0){if(G.lives<0){gameOver();return}P.x=P.tx=W/2;P.y=P.ty=H-110;P.inv=2.5}}
  else{
    const sp=150+40*P.speed;let kx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0),ky=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0);
    if(kx||ky){const l=Math.hypot(kx,ky);P.x+=kx/l*sp*dt;P.y+=ky/l*sp*dt;P.x=Math.max(14,Math.min(W-14,P.x));P.y=Math.max(60,Math.min(H-24,P.y));P.tx=P.x;P.ty=P.y}
    else{const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy),st=sp*dt;if(d>st){P.x+=dx/d*st;P.y+=dy/d*st}else{P.x=P.tx;P.y=P.ty}}
    if(P.inv>0)P.inv-=dt;
    if(P.shield>0){P.shield-=dt;if(P.shield<=0){P.shield=0;G.txt.push({x:P.x,y:P.y-24,s:"護盾消失",t:0})}}
    G.histAcc+=dt;while(G.histAcc>1/60){G.histAcc-=1/60;G.hist.push({x:P.x,y:P.y});if(G.hist.length>40)G.hist.shift()}
    // auto fire

    const blink=P.inv>0&&Math.floor(P.inv*12)%2===0;drawShip(P.x,P.y,blink?.35:1,P.shield>5||(P.shield>0&&Math.floor(P.shield*6)%2===0)?1:0)}
  // fx
  for(const f of G.fx){const k=f.t/f.life;if(f.ring){g.strokeStyle=f.c;g.globalAlpha=1-k;g.lineWidth=3;g.beginPath();g.arc(f.x,f.y,(f.small?6:10)+k*(f.small?16:36),0,7);g.stroke()}else{g.globalAlpha=1-k;g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,f.r*(1-k*.5),0,7);g.fill()}}g.globalAlpha=1;
  for(const t of G.txt)txt(t.s,t.x,t.y,t.big?30:13,t.big?"#ffd23f":"#fff");
  if(state==="play")hud();
  if(state==="title")titleScreen();
  if(state==="over")overScreen();
  if(paused&&state==="play"){g.fillStyle="rgba(10,14,28,.55)";g.fillRect(0,0,W,H);txt("暫停",W/2,H/2-10,34,"#fff");txt("點一下畫面繼續",W/2,H/2+30,15,"#dfe6ff")}
}
function hud(){const P=G.p;
  txt(String(G.score).padStart(7,"0"),12,22,18,"#fff","left");txt("HI "+String(Math.max(hi,G.score)).padStart(7,"0"),12,44,11,"#ffe9a8","left");
  txt(`第 ${G.stage} 關`,W/2,22,14,"#fff");
  for(let i=0;i<Math.min(G.lives,6);i++){g.save();g.translate(16+i*18,H-18);g.scale(.55,.55);drawShip(0,0,1,0);g.restore()}
  // power row
  let x=W-12;g.textAlign="right";
  const tags=[];if(P.shield>0)tags.push(["護盾"+Math.ceil(P.shield)+"秒",BELL_COL.red]);if(P.opts)tags.push(["分身×"+P.opts,BELL_COL.green]);if(P.twin)tags.push(["雙砲",BELL_COL.white]);tags.push(["速度"+P.speed,BELL_COL.blue]);
  for(const[s,c]of tags){txt(s,x,H-18,12,c,"right");g.font='800 12px sans-serif';x-=g.measureText(s).width+12}
  if(G.warnT>0&&Math.floor(G.warnT*4)%2===0){g.fillStyle="rgba(255,40,40,.25)";g.fillRect(0,H/2-34,W,68);txt("WARNING",W/2,H/2-6,30,"#ffdddd");txt("巨大鬧鐘來襲",W/2,H/2+20,14,"#fff")}
  if(G.clearT>0)txt(`第 ${G.stage} 關 通過！`,W/2,H/2,28,"#ffd23f");
  if(G.t<2.2&&G.clearT<=0)txt(`第 ${G.stage} 關`,W/2,H/2-40,28,"#fff")}
function titleScreen(){
  g.fillStyle="rgba(15,22,48,.35)";g.fillRect(0,0,W,H);
  txt("鈴鐺飛行隊",W/2,150,42,"#ffd23f");txt("打雲朵 · 接鈴鐺 · 守護天空",W/2,196,15,"#fff");
  drawShip(W/2,270,1,0);
  const items=[["yellow","黃：分數，連續吃越吃越多"],["white","打 1 下變白：雙發子彈"],["red","打 2 下變紅：護盾 60 秒無敵"],["blue","打 3 下變藍：加速"],["green","打 4 下變綠：分身"]];
  items.forEach(([c,s],k)=>{drawBell({x:W/2-110,y:330+k*34,c,flash:0});txt(s,W/2-88,330+k*34,14,"#fff","left")});
  txt("射擊鈴鐺會彈跳，每打一下換一種顏色",W/2,510,13,"#e8ecff");
  txt("手指按住任意處拖曳移動 · 自動射擊與投彈",W/2,532,13,"#e8ecff");
  if(Math.floor(stateT*2)%2===0)txt("點一下開始",W/2,580,22,"#fff");
  if(hi)txt("最高分 "+hi,W/2,612,12,"#ffe9a8")}
function overScreen(){g.fillStyle="rgba(15,22,48,.55)";g.fillRect(0,0,W,H);
  txt("GAME OVER",W/2,H/2-60,38,"#ff7a7a");txt("得分 "+G.score,W/2,H/2-10,22,"#fff");txt((G.score>=hi&&G.score>0?"新紀錄！":"最高分 "+hi),W/2,H/2+22,15,"#ffe9a8");
  if(stateT>1&&Math.floor(stateT*2)%2===0)txt("點一下再玩一次",W/2,H/2+80,20,"#fff")}

/* ================= loop ================= */
newGame();
let last=performance.now();
let errCount=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.max(0,Math.min(1/30,(now-last)/1000));last=now;
  try{update(dt);draw()}catch(e){errCount++;if(errCount<5)console.error(e)}}
requestAnimationFrame(frame);
window.__bell={get G(){return G},get state(){return state},start,step(n){for(let i=0;i<n;i++)update(1/60);draw()}};
})();
</script>
<div class="install" id="install" hidden>
  <p>想離線玩？在 Safari 點<b>分享</b>按鈕 → <b>加入主畫面</b>，之後從主畫面圖示開啟，沒網路也能玩。</p>
  <button id="installClose" aria-label="關閉">×</button>
</div>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
(function(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  let dismissed=false;try{dismissed=localStorage.getItem("bell.installHint")==="0"}catch(e){}
  const el=document.getElementById("install");
  if(ios&&!standalone&&!dismissed)el.hidden=false;
  document.getElementById("installClose").onclick=()=>{el.hidden=true;try{localStorage.setItem("bell.installHint","0")}catch(e){}};
})();
</script>
